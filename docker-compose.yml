version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: citytwin_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./ai_citytwin.db
      - SECRET_KEY=ai-citytwin-super-secret-production-jwt-key-2026-btech-cse
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - IS_DEMO_MODE=true
    volumes:
      - ./data:/app/data
      - ./ml/trained_models:/app/ml/trained_models
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: citytwin_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
